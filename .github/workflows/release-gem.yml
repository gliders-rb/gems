name: release one gem

# Called by release.yml, once per gem. RubyGems matches a trusted publisher on the OIDC `job_workflow_ref` claim, which
# names this file, so each gem's publisher on rubygems.org names `release-gem.yml` (not release.yml) and the environment
# `rubygems`.
on:
  workflow_call:
    inputs:
      name:
        description: The gem's name on RubyGems
        type: string
        required: true
      dir:
        description: The gem's directory in this repository
        type: string
        required: true
      probe:
        description: Only trade the OIDC token for a push key, then stop
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The RubyGems.org account (aemadrid-twx) that owns each new gem's first push. Public, not a secret.
  RUBYGEMS_OWNER: '171078'

jobs:
  publish:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write # rake release pushes the `<gem>/v<version>` tag
      id-token: write # the OIDC token RubyGems trades for a short-lived push key
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ${{ inputs.dir }}
      - uses: ./.github/actions/rubygems-push-key
        if: inputs.probe
        with:
          owner: ${{ env.RUBYGEMS_OWNER }}
      - name: The publisher matched
        if: inputs.probe
        run: echo "RubyGems accepted the token and the owner for this repository, workflow file and environment. Nothing was pushed."
      - name: Read the version
        if: ${{ !inputs.probe }}
        id: version
        env:
          GEM_NAME: ${{ inputs.name }}
        run: |
          version="$(ruby -e 'puts Gem::Specification.load(ARGV[0]).version' "$GEM_NAME.gemspec")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$GEM_NAME $version"
      - name: Skip a version RubyGems already has
        if: ${{ !inputs.probe }}
        id: published
        env:
          GEM_NAME: ${{ inputs.name }}
          GEM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://rubygems.org/api/v2/rubygems/$GEM_NAME/versions/$GEM_VERSION.json")"
          case "$code" in
            200) echo "already=true" >> "$GITHUB_OUTPUT"; echo "$GEM_NAME $GEM_VERSION is already on RubyGems; skipping" ;;
            404) echo "already=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "RubyGems answered $code for $GEM_NAME $GEM_VERSION" >&2; exit 1 ;;
          esac
      # The same gate as each gem's CI release-check job (SH-I7): nothing is published that would fail it.
      - name: release:check
        if: steps.published.outputs.already == 'false'
        run: bundle exec rake release:check
      - uses: ./.github/actions/rubygems-push-key
        if: steps.published.outputs.already == 'false'
        with:
          owner: ${{ env.RUBYGEMS_OWNER }}
      # Our step above made the key, with the owner a new gem needs; the action only tags, pushes and waits.
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
        if: steps.published.outputs.already == 'false'
        with:
          working-directory: ${{ inputs.dir }}
          setup-trusted-publisher: 'false'
          # v1.4.1 waits with rubygems-await 0.5.4, which raises NoMethodError on current RubyGems (it pushed
          # field_struct 1.0.0.pre1, then timed out). v1.4.2 fixes it but is days old, so we wait ourselves.
          await-release: 'false'
      - name: Wait until the index serves the new version
        if: steps.published.outputs.already == 'false'
        env:
          GEM_NAME: ${{ inputs.name }}
          GEM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The next layer resolves this gem from rubygems.org, so it has to be on the compact index first.
          for _ in $(seq 1 60); do
            if curl -sf "https://index.rubygems.org/info/$GEM_NAME" | grep -q "^$GEM_VERSION "; then
              echo "$GEM_NAME $GEM_VERSION is on the index"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$GEM_NAME $GEM_VERSION is not on the index after 10 minutes"
          exit 1
