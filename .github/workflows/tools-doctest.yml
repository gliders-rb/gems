name: tools-doctest

# The doc-test runner's own specs and RuboCop. The gem and site workflows run it on their docs. GitHub-hosted runners only.
on:
  push:
    branches: [main]
    paths:
      - 'tools/doctest/**'
      - '.github/workflows/tools-doctest.yml'
  pull_request:
    paths:
      - 'tools/doctest/**'
      - '.github/workflows/tools-doctest.yml'
  workflow_dispatch:

# Pull request code runs here, so the token stays read-only.
permissions:
  contents: read

concurrency:
  group: tools-doctest-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tools/doctest

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: tools/doctest
      - run: bundle exec rake

  # The one check to require in branch protection: green only when every gating job passed.
  required:
    name: tools-doctest (required)
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every gating job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
