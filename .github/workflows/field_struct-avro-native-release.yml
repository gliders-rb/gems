name: field_struct-avro-native release

# Builds the source gem and the precompiled platform gems (spec decision R1) and uploads them as workflow artifacts.
# It does NOT publish to RubyGems: the last job holds a disabled publish step for a human to enable.
#
# Not yet run on GitHub Actions. Treat the first run as a dry run: trigger it with workflow_dispatch before tagging.
on:
  push:
    tags:
      # The repo's release tag convention, as set by the Rakefile's tag_prefix.
      - 'field_struct-avro-native/v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field_struct-avro-native-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: adapters/field_struct-avro-native

jobs:
  # The source gem: what installs on any platform without a precompiled gem, compiling the Rust at install time.
  source-gem:
    name: source gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: '3.4'
          bundler-cache: false
          cargo-cache: true
          working-directory: adapters/field_struct-avro-native
      - run: mkdir -p pkg && gem build field_struct-avro-native.gemspec --output pkg/field_struct-avro-native-source.gem
      - name: Install the source gem (compiles the Rust) and smoke-test it
        run: support/smoke_install.sh pkg/field_struct-avro-native-source.gem "$RUNNER_TEMP/source-install"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem-source
          path: adapters/field_struct-avro-native/pkg/field_struct-avro-native-source.gem
          if-no-files-found: error

  # One cross-compiled gem per platform, built in the rb-sys-dock containers for Ruby 3.3, 3.4 and 4.0.
  cross-gem:
    name: build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64-linux, aarch64-linux, arm64-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'
      - uses: oxidize-rb/actions/cross-gem@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        id: cross
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: '3.3,3.4,4.0'
          working-directory: adapters/field_struct-avro-native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross.outputs.gem-path }}
          if-no-files-found: error

  # Install each platform gem on a runner of that platform and run the encode smoke script. The Rust toolchain is not
  # used: EXPECT_PRECOMPILED=1 fails the job if the install left any Rust sources behind.
  smoke:
    name: smoke ${{ matrix.platform }} / Ruby ${{ matrix.ruby }}
    needs: cross-gem
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x86_64-linux, os: ubuntu-latest, ruby: '3.3' }
          - { platform: x86_64-linux, os: ubuntu-latest, ruby: '3.4' }
          - { platform: x86_64-linux, os: ubuntu-latest, ruby: '4.0' }
          - { platform: aarch64-linux, os: ubuntu-24.04-arm, ruby: '3.4' }
          - { platform: arm64-darwin, os: macos-14, ruby: '3.4' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ runner.temp }}/platform-gem
      - name: Install the platform gem and smoke-test it
        env:
          EXPECT_PRECOMPILED: '1'
        run: support/smoke_install.sh "$(ls "$RUNNER_TEMP"/platform-gem/*.gem)" "$RUNNER_TEMP/platform-install"

  # Gathers the gems for a human to inspect. Publishing is deliberately off.
  release:
    name: release (publishing disabled)
    needs: [source-gem, cross-gem, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gem-*
          merge-multiple: true
          path: ${{ runner.temp }}/gems
      - name: List the gems
        run: ls -l "$RUNNER_TEMP/gems"
      # A human enables this step: uncomment it, add a RubyGems API key as the RUBYGEMS_API_KEY secret (or switch to
      # trusted publishing with `id-token: write`), and set `if: startsWith(github.ref, 'refs/tags/')`.
      # - name: Publish to RubyGems
      #   if: false
      #   env:
      #     GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
      #   run: |
      #     for gem in "$RUNNER_TEMP"/gems/*.gem; do
      #       gem push "$gem"
      #     done
