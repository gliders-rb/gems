name: integration-rails

# The one-file Rails app (SH-B64). Runs when either base gem or the app changes. GitHub-hosted runners only.
on:
  push:
    branches: [main]
    paths:
      - 'gems/**'
      - 'integration/rails/**'
      - '.github/workflows/integration-rails.yml'
  pull_request:
    paths:
      - 'gems/**'
      - 'integration/rails/**'
      - '.github/workflows/integration-rails.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-rails-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: integration/rails

jobs:
  # The app's default task (its examples and RuboCop) on each supported Rails line.
  test:
    name: Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    env:
      RAILS_VERSION: ${{ matrix.requirement }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rails: '7.2'
            requirement: '~> 7.2.0'
          - rails: '8.1'
            requirement: '~> 8.1.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'
      - run: bundle install
      - run: bundle exec rake

  # The one check to require in branch protection.
  required:
    name: integration-rails (required)
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every gating job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
