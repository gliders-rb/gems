name: field_struct-json_schema

# Runs only when the adapter, the base gem it builds against by path, or this workflow changes. GitHub-hosted runners only.
on:
  push:
    branches: [main]
    paths:
      - 'adapters/field_struct-json_schema/**'
      - 'gems/field_struct/**'
      - '.github/workflows/field_struct-json_schema.yml'
  pull_request:
    paths:
      - 'adapters/field_struct-json_schema/**'
      - 'gems/field_struct/**'
      - '.github/workflows/field_struct-json_schema.yml'
  workflow_dispatch:

# Pull request code runs here, so the token stays read-only.
permissions:
  contents: read

concurrency:
  group: field_struct-json_schema-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: adapters/field_struct-json_schema

jobs:
  # Specs and RuboCop on every supported Ruby.
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: adapters/field_struct-json_schema
      - run: bundle exec rake

  # Doctests, YARD completeness and the signature guards: everything `rake release:check` covers.
  release-check:
    name: release:check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: adapters/field_struct-json_schema
      - run: bundle exec rake release:check

  # JS-B90..B92: pattern_for against Node's RegExp, on the oldest and the newest Ruby (Onigmo differs between Rubies).
  differential:
    name: differential (Ruby ${{ matrix.ruby }}, Node 24)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: adapters/field_struct-json_schema
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: bundle exec rake differential

  # The one check to require in branch protection: green only when every gating job passed.
  required:
    name: field_struct-json_schema (required)
    if: always()
    needs: [test, release-check, differential]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every gating job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
