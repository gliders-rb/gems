name: actionable

# Runs only when actionable or field_struct (its dependency) changes. GitHub-hosted runners only.
on:
  push:
    branches: [main]
    paths:
      - 'gems/actionable/**'
      - 'gems/field_struct/**'
      - '.github/workflows/actionable.yml'
  pull_request:
    paths:
      - 'gems/actionable/**'
      - 'gems/field_struct/**'
      - '.github/workflows/actionable.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionable-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: gems/actionable

jobs:
  # Default task: core specs, adapter lanes (Rails, jobs, coverage) and RuboCop.
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: gems/actionable
      - run: bundle exec rake

  # Everything release:check covers: all spec lanes, doctests, signatures, the docs check and YARD.
  release-check:
    name: release:check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: gems/actionable
      - run: bundle exec rake release:check

  # ActiveRecord 7.1: transactions work, after_commit refuses to declare (AC-B#railsci).
  active-record-71:
    name: ActiveRecord 7.1
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gems/actionable/gemfiles/active_record_71.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
      - run: bundle install
      - run: bundle exec rspec spec/rails --tag '~doctest' --format progress

  # ActiveJob and Sidekiq (inline testing mode, no Redis) so those specs run instead of skipping.
  jobs:
    name: ActiveJob and Sidekiq
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: gems/actionable
      - run: bundle exec rake spec:job

  # Report-only: prints Steep's problem count and never fails.
  types:
    name: types (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: gems/actionable
      - run: bundle exec rake types:report

  # The one check to require in branch protection.
  required:
    name: actionable (required)
    if: always()
    needs: [test, release-check, active-record-71, jobs]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every gating job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
